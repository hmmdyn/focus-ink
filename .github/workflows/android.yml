name: Build

on:
  push:
    branches: [main, 'redesign/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Test and build
        shell: bash
        run: |
          set -o pipefail
          TASKS=":core:test"
          if [ -d app ]; then TASKS="$TASKS :app:assembleRelease"; fi
          gradle $TASKS --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Report errors as annotations
        if: failure()
        shell: bash
        run: |
          # Kotlin 컴파일 에러를 주석으로 올려서 CI 화면과 API 에서 바로 보이게 한다
          grep -E '^e: ' build.log | head -40 | while IFS= read -r line; do
            msg="${line#e: }"
            echo "::error::${msg//$'\n'/ }"
          done || true
          grep -E -A3 '^\* What went wrong' build.log | head -30 | tr '\n' ' ' | sed 's/^/::error::/' ; echo
          for f in core/build/test-results/test/*.xml; do
            [ -f "$f" ] || continue
            grep -o 'testcase name="[^"]*"[^>]*>[[:space:]]*<failure message="[^"]*"' "$f" | head -10 | sed 's/^/::error::TEST /' || true
          done

      - name: Upload APK
        if: success() && hashFiles('app/build/outputs/apk/release/*.apk') != ''
        uses: actions/upload-artifact@v4
        with:
          name: focus-ink-apk
          path: app/build/outputs/apk/release/*.apk

      - name: Publish "latest" release
        id: publish
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main' && hashFiles('app/build/outputs/apk/release/*.apk') != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/*.apk focus-ink.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest focus-ink.apk \
            --title "최신 빌드 (${GITHUB_SHA::7})" \
            --notes "main 브랜치 최신 커밋에서 자동 빌드. Palma 2 브라우저에서 focus-ink.apk 를 받아 설치하세요." \
            --target "$GITHUB_SHA" --prerelease

  # Palma 2 해상도(824x1648) 에뮬레이터에서 첫 실행부터 하루 흐름 전체를 눌러 보고 화면을 찍는다
  ui-walkthrough:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build app and test APKs
        run: gradle :app:assembleDebug :app:assembleDebugAndroidTest --no-daemon

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run walkthrough on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash .github/scripts/walkthrough.sh

      - name: Report test failure
        if: always()
        shell: bash
        run: |
          if [ -f instrument.txt ]; then
            if grep -q "FAILURES!!!\|INSTRUMENTATION_FAILED\|Process crashed" instrument.txt; then
              grep -E "Exception|Error|at com\.dain|FAILURES|Tests run" instrument.txt | head -25 | while IFS= read -r l; do echo "::error::${l}"; done
            fi
            grep -E "^OK \(" instrument.txt | sed 's/^/::notice::/' || true
          fi
          ls screens 2>/dev/null | wc -l | sed 's/^/::notice::screenshots /'

      - name: Publish screenshots branch
        if: always() && github.event_name == 'push'
        shell: bash
        run: |
          [ -d screens ] || exit 0
          mkdir -p /tmp/shots && cp screens/*.png /tmp/shots/ 2>/dev/null || exit 0
          cp instrument.txt /tmp/shots/ 2>/dev/null || true
          cd /tmp/shots
          # main 은 screenshots, 다른 브랜치는 screenshots-<브랜치> 에 올린다
          BR="screenshots"
          if [ "${GITHUB_REF_NAME}" != "main" ]; then BR="screenshots-${GITHUB_REF_NAME//\//-}"; fi
          git init -q -b "$BR"
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -qm "Walkthrough screenshots for ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" "$BR"
